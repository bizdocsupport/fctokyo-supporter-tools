<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="FC東京の観戦写真をシーズン・試合ごとに残す個人フォトアーカイブです。">
  <meta name="theme-color" content="#071a52">
  <title>FC東京 観戦日記｜PHOTO ARCHIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body class="matchdays-page">
  <header class="global-header">
    <a class="site-brand" href="../"><span class="brand-bars"><i></i><i></i></span><span>FC TOKYO<br>SUPPORTER TOOLS</span></a>
    <nav class="header-nav"><a href="../ticket/">TICKET</a><a href="../calendar/">CALENDAR</a><a href="../links/">LINKS</a></nav>
  </header>

  <main>
    <section class="matchdays-hero shell">
      <div>
        <p class="kicker">MATCHDAY PHOTO ARCHIVE / PERSONAL</p>
        <h1>観た試合を、<br><span>写真で残す。</span></h1>
        <p class="matchdays-intro">文章は付けず、シーズンと試合ごとに写真だけを並べる個人の観戦記録です。</p>
      </div>
      <div class="matchday-stats">
        <div class="matchday-stat"><small>MATCHES</small><strong id="match-count">0</strong></div>
        <div class="matchday-stat"><small>PHOTOS</small><strong id="photo-count">0</strong></div>
      </div>
    </section>

    <section class="season-bar shell" aria-label="シーズン選択">
      <span>SEASON</span>
      <div id="season-buttons"></div>
    </section>

    <section class="matchdays-section shell">
      <div id="matchday-grid" class="matchday-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="ticket-footer matchdays-footer shell"><a href="../">← ツール一覧へ</a><span>PERSONAL FC TOKYO PHOTO ARCHIVE</span></footer>

  <div id="matchday-modal" class="matchday-modal" role="dialog" aria-modal="true" aria-labelledby="modal-match-title">
    <div class="matchday-modal-header">
      <div class="matchday-modal-title"><p id="modal-match-date"></p><h2 id="modal-match-title"></h2></div>
      <button id="matchday-close" class="matchday-close" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="matchday-gallery"><img id="modal-photo" alt="観戦写真"></div>
    <div class="matchday-gallery-nav"><button id="photo-prev" type="button" aria-label="前の写真">‹</button><button id="photo-next" type="button" aria-label="次の写真">›</button></div>
    <div class="matchday-gallery-footer"><span id="photo-position">1 / 1</span></div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
